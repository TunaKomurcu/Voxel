services:
  - type: web
    name: voice-agent
    runtime: python
    plan: free
    buildCommand: 'true'
    startCommand: python deployment/browser/server.py
    envVars:
      # sync: false is what makes Render prompt for a value during Blueprint
      # creation. Nothing here is set for you; every one of these is prompted
      # for and stored only on the service, never written to this file.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # No AGENT / AGENT_ID here on purpose: server.py's `if os.environ.get("AGENT")`
      # branches into legacy single-agent mode whenever AGENT is set to any
      # non-empty value, so the var must be entirely absent (not even an
      # empty string) to keep multi-persona mode on by default. Paste each
      # agent's id from your own .env below when prompted.
      - key: AGENT_ID_VOXEL_INVESTOR
        sync: false
      - key: AGENT_ID_TECHNICAL_COFOUNDER
        sync: false
      - key: AGENT_ID_NON_TECHNICAL_BUYER
        sync: false
      - key: AGENT_ID_IMPATIENT_BUYER
        sync: false
